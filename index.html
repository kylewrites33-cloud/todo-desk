<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyle's To-Do Desk</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#1F5FBF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<style>
/* Layout: header and tab bar on top; each tab is its own page. The To-dos tab keeps a rail on the left. Everything stacks on phones. */
:root {
  --bg: #F3F5F7; --panel: #FFFFFF; --ink: #16202A; --muted: #5B6875; --faint: #8A96A2; --line: #DCE2E8; --hover: #EAEEF2;
  --accent: #1F5FBF; --accent-ink: #FFFFFF; --accent-soft: #E3ECF9;
  --late: #C2362B; --late-soft: #FBE7E4; --soon: #A86500; --soon-soft: #FBF0DC; --ok: #2E7D4F; --ok-soft: #E2F2E8;
  --p1: #1F5FBF; --p2: #B5487A; --p3: #2E7D4F; --p4: #A86500; --p5: #6B4FC4; --p6: #2A8A93; --p7: #6B7785;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11171D; --panel: #18212A; --ink: #E6ECF1; --muted: #A0ADB9; --faint: #74818D; --line: #2A3540; --hover: #212C36;
  --accent: #6FA2F0; --accent-ink: #0B1420; --accent-soft: #1C2D44;
  --late: #F07A6E; --late-soft: #3A1E1C; --soon: #E2A94A; --soon-soft: #352915; --ok: #6CC290; --ok-soft: #17301F;
  --p1: #6FA2F0; --p2: #E383AE; --p3: #6CC290; --p4: #E2A94A; --p5: #A893F0; --p6: #5CC3CB; --p7: #9AA6B2;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
header.top h1 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -0.01em; margin: 0; display: flex; align-items: center; gap: 10px; }
header.top h1 img { width: 30px; height: 30px; }
.topright { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.date, .sync { font-size: 14px; color: var(--muted); }
.sync.busy { color: var(--soon); }
.sync.err { color: var(--late); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 14px; font-weight: 600; }

.navbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 520px; min-width: 0; padding-bottom: 2px; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 10px; border-radius: 8px; white-space: nowrap; font-weight: 500; }
nav.tabs a:hover { background: var(--hover); color: var(--ink); }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.gsearch { flex: 0 1 180px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: left; display: grid; gap: 2px; }
.stat:hover { border-color: var(--accent); }
.stat .n { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat.late .n { color: var(--late); }
.stat.soon .n { color: var(--soon); }

.panel, .add, .settings { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.add .row, .formrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add input[type=text], .formrow input[type=text] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.add select, .add input[type=date], .formrow select, .formrow input, .field select, .field input, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 4px 10px; font-size: 13.5px; }
.btn.danger { color: var(--late); }
.btn.danger.armed { background: var(--late); color: var(--panel); border-color: var(--late); }
.hint { font-size: 12.5px; color: var(--faint); }
.hint code { font-family: var(--body); font-size: inherit; font-weight: 600; color: var(--muted); }
.settings h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.settings p { margin: 0; color: var(--muted); max-width: 65ch; }
.settings .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.result.ok { color: var(--ok); }
.result.bad { color: var(--late); }

h2.pt { font-family: var(--display); font-size: 24px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
h3.st { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
h3.st .ct { color: var(--faint); font-variant-numeric: tabular-nums; }
.pagehead { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.pagehead .sub { color: var(--muted); }
.back { font-size: 14px; text-decoration: none; }
.cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: grid; gap: 18px; min-width: 0; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 6px; text-decoration: none; color: var(--ink); align-content: start; min-width: 0; }
a.card:hover { border-color: var(--accent); }
.card .t { font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.card .d { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.rows { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.rows > li { border-top: 1px solid var(--line); padding: 11px 14px; display: grid; gap: 3px; min-width: 0; }
.rows > li:first-child { border-top: 0; }
.rows a.rt { font-weight: 600; text-decoration: none; color: var(--ink); }
.rows a.rt:hover { color: var(--accent); }
.rows .rd { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.rows .rm { color: var(--faint); font-size: 12.5px; }
.rows .dayrow { padding-block: 6px; background: var(--bg); color: var(--muted); font-size: 12.5px; font-weight: 600; }
.ev { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; }
.ev .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.bar { height: 6px; background: var(--hover); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); }
mark { background: var(--soon-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
details.sop { border-top: 1px solid var(--line); padding: 10px 14px; }
details.sop:first-child { border-top: 0; }
details.sop summary { cursor: pointer; font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
details.sop .md { margin-top: 8px; }

.main { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
aside.rail { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.rail h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 0 0 6px 10px; font-weight: 600; }
.navlist { display: grid; gap: 2px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; text-align: left; }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .ct { margin-left: auto; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--p7); display: inline-block; }
.newproj { display: flex; gap: 6px; padding: 4px 0 0 4px; }
.newproj input { flex: 1; min-width: 0; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 14px; }

section.list { display: grid; gap: 18px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar h2 { font-family: var(--display); font-size: 21px; font-weight: 700; margin: 0; }
.toolbar input { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; width: 220px; max-width: 100%; }
.group { display: grid; gap: 6px; min-width: 0; }
.group h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.group h3 .ct { color: var(--faint); font-variant-numeric: tabular-nums; }
.group.late h3 { color: var(--late); }
ul.tasks { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
li.task { border-top: 1px solid var(--line); }
li.task:first-child { border-top: 0; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 12px; }
.trow:hover { background: var(--hover); }
.check { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; padding: 0; display: grid; place-items: center; flex: none; }
.check:hover { border-color: var(--ok); }
.task.p-high .check { border-color: var(--late); }
.task.done .check, .check.on { background: var(--ok); border-color: var(--ok); }
.task.done .check::after, .check.on::after { content: ""; width: 5px; height: 9px; border: solid var(--panel); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.tbody { border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; display: grid; gap: 4px; }
.ttitle { font-weight: 500; overflow-wrap: anywhere; }
.task.done .ttitle, .lrow.done .ttitle { text-decoration: line-through; color: var(--faint); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 500; }
a.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.due { font-variant-numeric: tabular-nums; }
.chip.late { color: var(--late); background: var(--late-soft); border-color: transparent; }
.chip.soon { color: var(--soon); background: var(--soon-soft); border-color: transparent; }
.chip.okc { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
.chip.wait { color: var(--p5); }
.chip.doing { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.pri { color: var(--late); border-color: transparent; background: var(--late-soft); font-weight: 600; }
.notes-flag { color: var(--faint); }
.star { border: 0; background: transparent; padding: 2px 4px; font-size: 17px; line-height: 1; color: var(--line); }
.star:hover, .star[aria-pressed="true"] { color: var(--soon); }
.lrow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 11px 12px; border-top: 1px solid var(--line); }
.lrow:first-child { border-top: 0; }

.edit { padding: 4px 12px 14px 44px; display: grid; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field input, .field select, .field textarea { font-size: 14px; color: var(--ink); width: 100%; }
.field textarea { min-height: 140px; resize: vertical; }
textarea.raw { width: 100%; min-height: 420px; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.5; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .spacer { flex: 1; }

.md { overflow-wrap: anywhere; max-width: 75ch; }
.md > :first-child { margin-top: 0; }
.md h1 { font-family: var(--display); font-size: 24px; margin: 0 0 8px; }
.md h2 { font-family: var(--display); font-size: 18px; margin: 18px 0 6px; }
.md h3 { font-size: 15px; margin: 14px 0 4px; }
.md p, .md ul, .md ol { margin: 6px 0; }
.md ul, .md ol { padding-left: 22px; }
.md code { background: var(--hover); border-radius: 4px; padding: 0 4px; font-size: 13.5px; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--line); padding: 4px 8px; }
.md details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.md details summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line); }

.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th, table.data td { padding: 8px 12px; border-top: 1px solid var(--line); text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; }
table.data th { border-top: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
table.data td.num, table.data th.num { text-align: right; }
.spark { color: var(--accent); }
.trend .v { font-family: var(--display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 20px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }

@media (max-width: 860px) {
  .main, .cols { grid-template-columns: minmax(0, 1fr); }
  aside.rail { position: static; }
  .navlist.projects, .navlist.views { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .navlist .nav { width: auto; white-space: nowrap; }
  .navlist.projects .nav { border: 1px solid var(--line); background: var(--panel); }
  .newproj { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats .stat:nth-child(n+4) { display: none; }
  .fields, .settings .fields { grid-template-columns: minmax(0, 1fr); }
  .edit { padding-left: 12px; }
  .gsearch { flex: 1 1 100%; }
  .ev { grid-template-columns: 70px minmax(0, 1fr); }
  .ev > :last-child { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) { .trow, .nav, .stat, .card { transition: background-color .12s, border-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><img src="favicon.svg" alt="">Kyle's To-Do Desk</h1>
    <div class="topright">
      <span class="sync" id="sync"></span>
      <span class="date" id="today"></span>
      <button class="linkbtn" id="openSettings" type="button">Settings</button>
    </div>
  </header>

  <form class="settings" id="settings" hidden autocomplete="off">
    <h2>Connect to your workspace</h2>
    <p>Paste your GitHub key below. It stays in this browser only. Leave the other boxes as they are.</p>
    <div class="fields">
      <label class="field wide">Key<input type="password" id="sKey" placeholder="github_pat_…"></label>
      <label class="field">Owner<input id="sOwner"></label>
      <label class="field">Repository<input id="sRepo"></label>
      <label class="field">Branch<input id="sBranch"></label>
      <label class="field">To-do file<input id="sPath"></label>
    </div>
    <div class="actions">
      <button class="btn" type="button" id="sTest">Test connection</button>
      <button class="btn primary" type="submit">Save</button>
      <button class="btn" type="button" id="sClose">Close</button>
      <span class="result" id="sResult"></span>
    </div>
  </form>

  <div class="navbar">
    <nav class="tabs" id="tabs"></nav>
    <input type="search" class="gsearch" id="gsearch" placeholder="Search everything" aria-label="Search everything">
  </div>

  <main id="page"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ===================== todos.md format =====================
// Each to-do is one Markdown line, with optional Dataview-style fields and indented note lines:
//   - [ ] Title [due:: 2026-10-20] [project:: Leads Team] [priority:: high] [waiting:: Amy] [status:: doing] [star:: yes] [created:: 2026-10-19T14:45:00Z] (from [Source](path), added 2026-10-19)
//       A note line
// Sections are "## Open", "## Administrative" and "## Done". A "Projects: A · B · C" line lists the projects.
// Launch checklists in launches/*.md use the same line format.
const FIELD_ORDER = ["due", "project", "priority", "waiting", "status", "star", "created", "done"];
const ADMIN = "Administrative";

function parseDoc(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const entries = [];
  let section = null;
  for (const line of lines) {
    const h = line.match(/^##\s+(.+?)\s*$/);
    if (h) { section = h[1]; entries.push({ type: "heading", text: line, name: section }); continue; }
    const m = line.match(/^- \[( |x|X)\] (.*)$/);
    if (m) { entries.push(parseTask(m[1] !== " ", m[2], section)); continue; }
    const last = entries[entries.length - 1];
    if (last && last.type === "task" && /^(\s{2,}|\t)\S/.test(line)) { last.notes.push(line.replace(/^(\t| {1,4})/, "")); continue; }
    entries.push({ type: "raw", text: line });
  }
  return entries;
}
function parseTask(done, body, section) {
  let tail = "";
  let ti = body.lastIndexOf(" (from ");
  if (ti < 0) ti = body.lastIndexOf(" (added ");
  if (ti >= 0 && body.trimEnd().endsWith(")")) { tail = body.slice(ti + 1).trimEnd(); body = body.slice(0, ti); }
  const fields = {};
  body = body.replace(/\s*\[([A-Za-z_]+):: ([^\]]*)\]/g, (m0, k, v) => { fields[k.toLowerCase()] = v.trim(); return ""; }).trim();
  return { type: "task", done, title: body, fields, tail, notes: [], section };
}
function taskLines(t) {
  let s = `- [${t.done ? "x" : " "}] ${t.title}`;
  const keys = FIELD_ORDER.concat(Object.keys(t.fields).filter((k) => !FIELD_ORDER.includes(k)));
  for (const k of keys) if (t.fields[k]) s += ` [${k}:: ${t.fields[k]}]`;
  if (t.tail) s += " " + t.tail;
  return [s].concat(t.notes.filter((n) => n.trim()).map((n) => "    " + n));
}
function serialize(entries) { return entries.flatMap((e) => (e.type === "task" ? taskLines(e) : [e.text])).join("\n"); }
function keyOf(t) { return taskLines(t)[0]; }
function projectsLine(entries) { return entries.find((e) => e.type === "raw" && /^Projects:/.test(e.text)); }
function listedProjects(entries) {
  const l = projectsLine(entries);
  return l ? l.text.replace(/^Projects:\s*/, "").split("·").map((s) => s.trim()).filter(Boolean) : [];
}
function sectionFor(t) { return t.done ? "Done" : (t.fields.project === ADMIN || (!t.fields.project && t.section === ADMIN)) ? ADMIN : "Open"; }
function insertTop(entries, sectionName, t) {
  t.section = sectionName;
  let hi = entries.findIndex((e) => e.type === "heading" && e.name === sectionName);
  if (hi < 0) {
    while (entries.length && entries[entries.length - 1].type === "raw" && !entries[entries.length - 1].text.trim()) entries.pop();
    entries.push({ type: "raw", text: "" }, { type: "heading", text: "## " + sectionName, name: sectionName }, { type: "raw", text: "" });

  return `<div class="stats">${cells.map((x) => `<button class="stat ${x.cls}" data-view="${x.v}"><span class="n">${x.n}</span><span class="l">${x.l}</span></button>`).join("")}</div>`;
}
function addFormHtml() {
  return `<form class="add" id="addForm" autocomplete="off">
    <div class="row">
      <input type="text" id="addTitle" placeholder="Add a to-do… e.g. Send Leads Team the new script #leads !high @Amy" aria-label="New to-do">
      <select id="addProject" aria-label="Project"><option value="">No project</option>${D.projects.map((p) => `<option ${projectFilter === p.name ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
      <input type="date" id="addDue" aria-label="Due date">
      <select id="addPri" aria-label="Priority"><option value="">Normal</option><option value="high">High</option><option value="low">Low</option></select>
      <button class="btn primary" type="submit">Add</button>
    </div>
    <div class="hint">Shortcuts in the text: <code>#project</code> picks a project, <code>!high</code> or <code>!low</code> sets priority, <code>@name</code> marks it as waiting on that person.</div>
  </form>`;
}
function taskHtml(t, showProject = true) {
  const chips = [];
  if (t.priority === "high") chips.push(`<span class="chip pri">High</span>`);
  if (t.due && !t.done) { const n = daysFromToday(t.due); chips.push(`<span class="chip due ${n < 0 ? "late" : n <= 1 ? "soon" : ""}">${n < 0 ? "Overdue · " : ""}${esc(fmtDue(t.due))}</span>`); }
  else if (t.done && t.doneOn) chips.push(`<span class="chip due">Done ${esc(fmtDue(t.doneOn))}</span>`);
  if (t.project && showProject) chips.push(`<span class="chip"><span class="dot" style="background:${projColor(t.project)}"></span>${esc(t.project)}</span>`);
  if (t.status === "doing") chips.push(`<span class="chip doing">In progress</span>`);
  if (t.status === "waiting") chips.push(`<span class="chip wait">Waiting${t.waiting ? " on " + esc(t.waiting) : ""}</span>`);
  if (t.notes) chips.push(`<span class="notes-flag">Notes</span>`);
  const isOpen = openKey === t.key;
  return `<li class="task p-${t.priority || "med"} ${t.done ? "done" : ""}" data-key="${esc(t.key)}">
    <div class="trow">
      <button class="check" data-act="toggle" aria-label="${t.done ? "Mark not done" : "Mark done"}"></button>
      <button class="tbody" data-act="open" aria-expanded="${isOpen}"><span class="ttitle">${esc(t.title)}</span>${chips.length ? `<span class="meta">${chips.join("")}</span>` : ""}</button>
      ${t.done ? "<span></span>" : `<button class="star" data-act="star" aria-pressed="${t.star}" title="${t.star ? "Remove from Today" : "Add to Today"}" aria-label="Star for today">★</button>`}
    </div>
    ${isOpen ? editHtml(t) : ""}
  </li>`;
}
function editHtml(t) {
  const opts = (pairs, cur) => pairs.map(([k, v]) => `<option value="${esc(k)}" ${k === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  return `<form class="edit" data-edit="${esc(t.key)}">
    <div class="fields">
      <label class="field wide">To-do<input name="title" value="${esc(t.title)}"></label>
      <label class="field">Project<select name="project">${opts([["", "No project"]].concat(D.projects.map((p) => [p.name, p.name])), t.project)}</select></label>
      <label class="field">Status<select name="status">${opts([["todo", "To do"], ["doing", "In progress"], ["waiting", "Waiting"], ["done", "Done"]], t.status)}</select></label>
      <label class="field">Priority<select name="priority">${opts([["high", "High"], ["", "Normal"], ["low", "Low"]], t.priority)}</select></label>
      <label class="field">Due date<input type="date" name="due" value="${esc(t.due || "")}"></label>
      <label class="field">Waiting on<input name="waiting" value="${esc(t.waiting)}" placeholder="Person or team"></label>
      <label class="field wide">Notes<textarea name="notes">${esc(t.notes)}</textarea></label>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit">Save</button>
      <button class="btn" type="button" data-act="close">Cancel</button>
      ${t.source ? `<span class="hint">From <a href="${esc(t.source.url)}" ${t.source.url.startsWith("#") ? "" : 'target="_blank" rel="noopener"'}>${esc(t.source.label)}</a></span>` : ""}
      <span class="spacer"></span>
      <button class="btn danger ${armedDelete === t.key ? "armed" : ""}" type="button" data-act="delete">${armedDelete === t.key ? "Click again to delete" : "Delete"}</button>
    </div>
    ${t.added ? `<div class="hint">Added ${esc(parseYmd(t.added).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }))}</div>` : ""}
  </form>`;
}
function group(title, list, cls = "", showProject = true) {
  if (!list.length) return "";
  return `<div class="group ${cls}"><h3>${esc(title)}<span class="ct">${list.length}</span></h3><ul class="tasks">${list.map((t) => taskHtml(t, showProject)).join("")}</ul></div>`;
}
function todayGroups(o) {
  const by = (f) => sortTasks(o.filter((t) => t.due && f(daysFromToday(t.due))));
  return group("Overdue", by((n) => n < 0), "late") + group("Due today", by((n) => n === 0)) +
    group("Starred for today", sortTasks(o.filter((t) => t.star && !(t.due && daysFromToday(t.due) <= 0))));
}
function todosListHtml() {
  const label = VIEWS.find((v) => v.id === view).label;
  const pf = projectFilter ? projByName(projectFilter) : null;
  let html = `<div class="toolbar"><h2>${esc(label)}${projectFilter ? " · " + esc(projectFilter) : ""}</h2><div class="actions">${pf ? `<a class="btn small" href="#projects/${esc(pf.slug)}">Open project page</a>` : ""}<input type="search" id="search" placeholder="Filter to-dos" value="${esc(q)}" aria-label="Filter to-dos"></div></div>`;
  const o = visible(openTasks());
  let body = "";
  const by = (f) => sortTasks(o.filter((t) => t.due && f(daysFromToday(t.due))));
  if (view === "today") {
    body = todayGroups(o);
    if (!body) body = `<div class="empty">Nothing due today. Star a to-do to pin it here.</div>` + group("Coming up next", o.filter((t) => t.due).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5));
  } else if (view === "upcoming") {
    body = group("Overdue", by((n) => n < 0), "late") + group("Today", by((n) => n === 0)) + group("Tomorrow", by((n) => n === 1)) +
      group("Next 7 days", by((n) => n > 1 && n <= 7)) + group("Later", by((n) => n > 7)) + group("No due date", sortTasks(o.filter((t) => !t.due)));
  } else if (view === "projects") {
    body = D.projects.map((p) => group(p.name, sortTasks(o.filter((t) => t.project === p.name)), "", false)).join("") + group("No project", sortTasks(o.filter((t) => !t.project)));
  } else if (view === "waiting") {
    const w = o.filter((t) => t.status === "waiting");
    body = [...new Set(w.map((t) => t.waiting || "Someone"))].sort().map((n) => group(n, sortTasks(w.filter((t) => (t.waiting || "Someone") === n)))).join("");
    if (!body) body = `<div class="empty">Nothing is waiting on anyone. Set a to-do's status to Waiting, or add one with <code>@name</code>.</div>`;
  } else if (view === "all") body = group("Open", sortTasks(o));
  else if (view === "done") {
    body = group("Done", visible(tasks().filter((t) => t.done)).slice(0, 150));
    if (!body) body = `<div class="empty">Finished to-dos land here.</div>`;
  }
  if (!body) body = `<div class="empty">${q || projectFilter ? "No to-dos match." : "No open to-dos. Add one above."}</div>`;
  return html + body;
}
function pageTodos() {
  const o = openTasks();
  const counts = { today: o.filter((t) => (t.due && daysFromToday(t.due) <= 0) || t.star).length, upcoming: o.filter((t) => t.due).length,
    projects: o.length, waiting: o.filter((t) => t.status === "waiting").length, all: o.length, done: tasks().length - o.length };
  return statsHtml() + addFormHtml() + `<div class="main">
    <aside class="rail">
      <div><h2>Views</h2><div class="navlist views">${VIEWS.map((v) => `<button class="nav" data-view="${v.id}" aria-current="${view === v.id}">${esc(v.label)}<span class="ct">${counts[v.id]}</span></button>`).join("")}</div></div>
      <div><h2>Projects</h2><div class="navlist projects">

        ${D.projects.map((p) => `<button class="nav" data-project="${esc(p.name)}" aria-current="${projectFilter === p.name}"><span class="dot" style="background:var(--${p.color})"></span>${esc(p.name)}<span class="ct">${o.filter((t) => t.project === p.name).length || ""}</span></button>`).join("")}
      </div>

    </aside>
    <section class="list" id="list">${todosListHtml()}</section>

}

// ===================== pages =====================
const TABS = [["home", "Home"], ["todos", "To-dos"], ["projects", "Projects"], ["people", "People"], ["library", "Meetings & Slack"], ["sops", "SOPs"], ["decisions", "Decisions"], ["launches", "Launches"], ["reels", "Reels"], ["leads", "Leads"], ["review", "Review"]];
let editingPath = null;
function route() {
  let h = location.hash.replace(/^#/, "");
  try { h = decodeURIComponent(h); } catch (e) {}
  const i = h.indexOf("/");
  return i < 0 ? { head: h || "home", arg: "" } : { head: h.slice(0, i), arg: h.slice(i + 1) };
}

function eventsHtml(list, withDay) {
  if (!list.length) return "";
  let html = "", day = "";
  for (const e of list) {
    const d = etDay(e.start);
    if (withDay && d !== day) { day = d; html += `<li class="dayrow">${esc(etDayLabel(e.start))}</li>`; }
    const others = (e.attendees || []).filter((a) => !/^kyle/i.test(a));
    html += `<li><div class="ev"><span class="tm">${esc(etTime(e.start))}</span><span><strong>${esc(e.title)}</strong>${others.length ? `<span class="rd"> · ${others.slice(0, 5).map((a) => { const p = personFor(a); return p ? `<a href="#people/${esc(p.slug)}">${esc(p.name.split(" ")[0])}</a>` : esc(a); }).join(", ")}</span>` : ""}</span>${e.link ? `<a class="btn small" href="${esc(e.link)}" target="_blank" rel="noopener">Join</a>` : "<span></span>"}</div></li>`;
  }
  return `<ul class="rows">${html}</ul>`;
}
function launchCard(l) {
  const done = l.items.filter((i) => i.done).length, n = l.items.length;
  const days = l.date ? Math.round((parseYmd(etDay(l.date)) - parseYmd(todayStr())) / 86400000) : null;

  return `<a class="card" href="#launches/${esc(l.slug)}"><span class="t">${esc(l.name)}</span>
    <span class="meta"><span class="chip ${days != null && days >= 0 && days <= 3 ? "soon" : ""}">${esc(when)}</span>${l.date ? `<span>${esc(etDayLabel(l.date))}${l.date.includes("T") ? ", " + esc(etTime(l.date)) + " ET" : ""}</span>` : ""}</span>

function docRow(d) {
  return `<li><a class="rt" href="${docLink(d.path)}">${esc(d.title)}</a><span class="rm">${d.kind === "meeting" ? "Meeting" : "Slack"} · ${esc(d.when || fmtDay(d.date))}</span>${d.summary ? `<span class="rd">${esc(short(d.summary, 220))}</span>` : ""}</li>`;

function sopsHtml(list, empty) {

function sparkline(vals) {

  const pts = v.map((x, i) => [4 + (i * (w - 8)) / (v.length - 1), h - 4 - ((x - min) / r) * (h - 8)]);
  const last = pts[pts.length - 1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}

// Don't redraw under someone who is typing; redraw when they leave the field.
let pendingRender = false;
const typing = () => { const a = document.activeElement; return !!a && $("page").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.id !== "search"; };
function softRender() { if (typing()) pendingRender = true; else render(); }
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; render(); } }, 0));

// ===================== saving =====================
let toastTimer = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3600); }
function setSync(text, cls = "") { const el = $("sync"); el.textContent = text; el.className = "sync " + cls; }

// Every change is applied to a fresh copy of the file, so edits made elsewhere (the meeting and Slack routines) are never overwritten.
let queue = Promise.resolve(), pending = 0;
function writeFile(path, op, message, okMsg) {
  if (!settings.key) { toast("Open Settings and paste your GitHub key first."); return; }
  try { const local = op(files[path] ?? null); if (typeof local === "string") { files[path] = local; if (path === settings.path) entries = parseDoc(local); derive(); } } catch (e) {}
  render();
  pending++; setSync("Saving…", "busy");
  queue = queue.then(async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const f = await getFile(path);
        const out = op(f.text);
        if (out === false) throw Object.assign(new Error("gone"), { gone: true });
        const r = await api(settings, `/contents/${enc(path)}`, "PUT", { message: "To-Do Desk: " + message, content: textToB64(out), branch: settings.branch, ...(f.sha ? { sha: f.sha } : {}) });
        files[path] = out; shas[path] = r.content.sha; cachePut(r.content.sha, out);
        if (path === settings.path) entries = parseDoc(out);
        derive();
        if (okMsg) toast(okMsg);
        return;
      } catch (e) {
        if ((e.status === 409 || e.status === 422) && attempt < 2) continue;
        toast(e.gone ? "That item was changed somewhere else. Showing the latest version." : explain(e));
        await reload(true);
        return;
      }
    }
  }).finally(() => { pending--; if (!pending) setSync("Saved"); softRender(); });
}
function mutateTodos(op, message, okMsg) {
  writeFile(settings.path, (text) => { if (text == null) return false; const d = parseDoc(text); if (op(d) === false) return false; return serialize(d); }, message, okMsg);
}
async function reload(force) {
  if (!settings.key) { loaded = false; render(); return; }
  if (pending && !force) return;
  try { setSync(loaded ? "Checking…" : "Loading…", "busy"); await loadAll(); loaded = true; setSync("Up to date"); }
  catch (e) { setSync("Not connected", "err"); toast(explain(e)); }
  softRender();
}
const findTask = (list, key) => list.find((e) => e.type === "task" && keyOf(e) === key);

function parseQuick(text) {
  let title = text, project = null, priority = null, waiting = null;
  title = title.replace(/(^|\s)#([\w&-]+)/g, (m, sp, tag) => {
    const k = tag.toLowerCase().replace(/[^a-z0-9]/g, "");
    const hit = D.projects.find((p) => p.name.toLowerCase().replace(/[^a-z0-9]/g, "").startsWith(k));
    if (hit) { project = hit.name; return sp; } return m;
  });
  title = title.replace(/(^|\s)!(high|h|low|l)\b/gi, (m, sp, p) => { priority = p[0].toLowerCase() === "h" ? "high" : "low"; return sp; });
  title = title.replace(/(^|\s)@([\w.-]+)/g, (m, sp, who) => { waiting = who; return sp; });
  return { title: title.replace(/\s+/g, " ").replace(/[\[\]]/g, "").trim(), project, priority, waiting };
}
const nowIso = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");

document.addEventListener("submit", (e) => {
  const f = e.target;
  if (f.id === "addForm") {
    e.preventDefault();
    const p = parseQuick($("addTitle").value);
    if (!p.title) return;
    const due = $("addDue").value;
    const starIt = !due && (route().head !== "todos" || view === "today");
    const fields = { due: due || "", project: p.project || $("addProject").value || "", priority: p.priority || $("addPri").value,
      waiting: p.waiting || "", status: p.waiting ? "waiting" : "", star: starIt ? "yes" : "", created: nowIso() };
    const make = () => ({ type: "task", done: false, title: p.title, fields: { ...fields }, tail: `(added ${todayStr()})`, notes: [], section: null });
    $("addTitle").value = "";
    mutateTodos((list) => { const t = make(); insertTop(list, sectionFor(t), t); }, "add " + short(p.title), "Added");
  } else if (f.id === "newProj") {
    e.preventDefault();
    const name = $("newProjName").value.trim().replace(/[·\[\]]/g, "");
    if (!name) return;
    mutateTodos((list) => {
      const names = listedProjects(list); if (names.includes(name)) return;
      names.push(name);
      const l = projectsLine(list), text = "Projects: " + names.join(" · ");
      if (l) l.text = text; else { const i = list.findIndex((x) => x.type === "heading"); list.splice(i < 0 ? list.length : i, 0, { type: "raw", text }, { type: "raw", text: "" }); }
    }, "add project " + name, "Project added");
  } else if (f.matches("form[data-edit]")) {
    e.preventDefault();
    const key = f.dataset.edit, fd = new FormData(f), status = fd.get("status");
    openKey = null;
    mutateTodos((list) => {
      const t = findTask(list, key); if (!t) return false;
      t.title = String(fd.get("title")).replace(/[\[\]]/g, "").trim() || t.title;
      const project = fd.get("project");
      t.fields.project = project === ADMIN && t.section === ADMIN ? "" : project;
      t.fields.priority = fd.get("priority"); t.fields.due = fd.get("due") || "";
      t.fields.waiting = String(fd.get("waiting") || "").replace(/[\[\]]/g, "").trim();
      t.fields.status = status === "doing" || status === "waiting" ? status : "";
      const done = status === "done";
      if (done && !t.done) { t.fields.done = todayStr(); t.fields.star = ""; }
      if (!done) t.fields.done = "";
      t.done = done;
      t.notes = String(fd.get("notes") || "").split("\n").map((s) => s.trimEnd()).filter(Boolean);
      moveTask(list, t);
    }, "edit: " + short(String(fd.get("title"))), "Saved");
  } else if (f.id === "fileEditor") {
    e.preventDefault();
    const path = f.dataset.path, text = $("rawText").value.replace(/\r\n/g, "\n");
    editingPath = null;
    writeFile(path, () => text, "edit " + path, "Saved");
  } else if (f.id === "decForm") {
    e.preventDefault();
    const text = $("decText").value.replace(/[\[\]]/g, "").trim(); if (!text) return;
    const project = $("decProject").value;
    const line = `- ${todayStr()} · ${text}${project ? ` [project:: ${project}]` : ""} [created:: ${nowIso()}]`;
    $("decText").value = "";
    writeFile("decisions.md", (cur) => {
      let s = cur ?? "# Decisions\n\n## Decisions\n";
      if (!/^## Decisions\s*$/m.test(s)) s = s.trimEnd() + "\n\n## Decisions\n";
      return s.replace(/^## Decisions[ \t]*\n*/m, "## Decisions\n\n" + line + "\n").replace(/\n{3,}/g, "\n\n");
    }, "decision: " + short(text), "Decision added");
  } else if (f.id === "launchAdd") {
    e.preventDefault();
    const path = f.dataset.path, title = $("launchItem").value.replace(/[\[\]]/g, "").trim(); if (!title) return;
    const due = $("launchDue").value;
    $("launchItem").value = "";
    writeFile(path, (text) => {
      if (text == null) return false;
      const d = parseDoc(text);
      const t = { type: "task", done: false, title, fields: { due, created: nowIso() }, tail: "", notes: [], section: "Checklist" };
      const items = d.filter((x) => x.type === "task");
      if (items.length) d.splice(d.indexOf(items[items.length - 1]) + 1, 0, t); else insertTop(d, "Checklist", t);
      return serialize(d);
    }, "launch item: " + short(title), "Added");
  } else if (f.id === "leadsForm") {
    e.preventDefault();
    const fd = new FormData(f), head = D.leads.head;
    const cells = head.map((h, i) => String(fd.get("c" + i) || "").trim());
    if (!cells[0]) { toast("Pick the week first."); return; }
    writeFile("leads/weekly.csv", (text) => {
      const rows = parseCsv(text || head.join(",") + "\n");
      const body = rows.slice(1).filter((r) => r[0] !== cells[0]);
      body.push(cells);
      body.sort((a, b) => a[0].localeCompare(b[0]));
      return [rows[0]].concat(body).map((r) => r.map(csvCell).join(",")).join("\n") + "\n";
    }, "leads week " + cells[0], "Week saved");
  } else if (f.id === "settings") {
    e.preventDefault();
    settings = formSettings();
    try { localStorage.setItem("todo-desk-settings", JSON.stringify(settings)); } catch (err) { toast("This browser wouldn't save the key. It will work until you close the tab."); }
    showSettings(false); if (location.hash === "#settings") history.replaceState(null, "", "#home"); reload();
  }
});

document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]");
  if (v) { view = v.dataset.view; openKey = null; try { localStorage.setItem("todo-desk-view", view); } catch (err) {} if (route().head !== "todos") location.hash = "#todos"; else render(); return; }
  const pj = e.target.closest("[data-project]");
  if (pj) { projectFilter = pj.dataset.project || null; openKey = null; render(); return; }
  const fp = e.target.closest("[data-filter-project]");
  if (fp) { projectFilter = fp.dataset.filterProject; view = "all"; location.hash = "#todos"; return; }
  const ef = e.target.closest("[data-editfile]");
  if (ef) { editingPath = ef.dataset.editfile; render(); return; }
  if (e.target.id === "cancelEdit") { editingPath = null; render(); return; }
  const nb = e.target.closest("[data-newbrief]");
  if (nb) {
    const name = nb.dataset.newbrief, slug = slugify(name), path = "projects/" + slug + ".md";
    const tpl = `---\nname: ${name}\nstatus: active\nowner: Kyle Heath\npeople: []\nkeywords: []\ncreated_at: ${nowIso()}\n---\n\n## Goal\n\n\n## Notes\n\n`;
    files[path] = tpl; derive(); editingPath = path;
    if (route().arg === slug) render(); else location.hash = "#projects/" + slug;
    return;
  }
  if (e.target.id === "copyReview") {
    const text = reviewText();
    if (!navigator.clipboard) { toast("Couldn't copy here. Select the text on the page instead."); return; }
    navigator.clipboard.writeText(text).then(() => toast("Copied. Paste it into Slack or an email."), () => toast("Couldn't copy. Select the text on the page instead."));
    return;
  }
  const lc = e.target.closest("[data-launch]");
  if (lc) {
    const path = lc.dataset.launch, key = lc.dataset.lkey;
    writeFile(path, (text) => {
      if (text == null) return false;
      const d = parseDoc(text); const t = findTask(d, key); if (!t) return false;
      t.done = !t.done; t.fields.done = t.done ? todayStr() : "";
      return serialize(d);
    }, "launch item: " + short(key.replace(/^- \[.\] /, "")));
    return;
  }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const key = act.closest("li.task")?.dataset.key, cur = findTask(entries, key);
  if (!cur) return;
  const a = act.dataset.act;
  if (a === "open") { openKey = openKey === key ? null : key; armedDelete = null; render(); }
  else if (a === "close") { openKey = null; armedDelete = null; render(); }
  else if (a === "toggle") {
    const done = !cur.done;
    mutateTodos((list) => { const t = findTask(list, key); if (!t) return false;
      t.done = done; t.fields.done = done ? todayStr() : ""; if (done) t.fields.star = ""; if (done && t.fields.status) t.fields.status = "";
      moveTask(list, t); }, (done ? "done: " : "reopen: ") + short(cur.title), done ? "Done" : "Reopened");
  } else if (a === "star") {
    mutateTodos((list) => { const t = findTask(list, key); if (!t) return false; t.fields.star = t.fields.star === "yes" ? "" : "yes"; }, "star: " + short(cur.title));
  } else if (a === "delete") {
    if (armedDelete !== key) { armedDelete = key; render(); return; }
    armedDelete = null; openKey = null;
    mutateTodos((list) => { const t = findTask(list, key); if (!t) return false; list.splice(list.indexOf(t), 1); }, "delete: " + short(cur.title), "Deleted");
  }
});
document.addEventListener("change", (e) => {
  const s = e.target.closest("select[data-reel]");
  if (!s) return;
  const path = s.dataset.reel, status = s.value;
  s.blur();
  writeFile(path, (text) => (text == null ? false : setFrontmatter(text, "status", status)), `reel ${status}: ${fileSlug(path)}`, "Status saved");
});
let searchTimer = null;
document.addEventListener("input", (e) => {
  if (e.target.id === "search") {
    q = e.target.value.trim();
    const pos = e.target.selectionStart;
    $("list").innerHTML = todosListHtml();
    const s = $("search"); s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {}
  } else if (e.target.id === "gsearch") {
    clearTimeout(searchTimer);
    const v = e.target.value.trim();
    searchTimer = setTimeout(() => { if (v.length >= 2) location.hash = "#search/" + encodeURIComponent(v); else if (route().head === "search") location.hash = "#home"; }, 250);
  }
});

// ===================== settings panel =====================
function showSettings(show) {
  $("settings").hidden = !show;
  if (show) { $("sKey").value = settings.key || ""; $("sOwner").value = settings.owner; $("sRepo").value = settings.repo; $("sBranch").value = settings.branch; $("sPath").value = settings.path; $("sResult").textContent = ""; }
}
const formSettings = () => ({ key: $("sKey").value.trim(), owner: $("sOwner").value.trim() || DEFAULTS.owner, repo: $("sRepo").value.trim() || DEFAULTS.repo, branch: $("sBranch").value.trim() || DEFAULTS.branch, path: $("sPath").value.trim() || DEFAULTS.path });
$("openSettings").addEventListener("click", () => showSettings($("settings").hidden));
$("sClose").addEventListener("click", () => showSettings(false));
$("sTest").addEventListener("click", async () => {
  const r = $("sResult"); r.className = "result"; r.textContent = "Testing…";
  try { const s = formSettings(); const f = await getFile(s.path, s); if (f.text == null) throw Object.assign(new Error(), { status: 404 }); const n = parseDoc(f.text).filter((x) => x.type === "task").length; r.className = "result ok"; r.textContent = `Connected. Found ${n} to-dos.`; }
  catch (e) { r.className = "result bad"; r.textContent = explain(e); }
});

// ===================== start =====================
window.addEventListener("hashchange", () => {
  if (location.hash === "#settings") { showSettings(true); return; }
  editingPath = null; openKey = null;
  if (route().head !== "search") $("gsearch").value = "";
  render(); window.scrollTo(0, 0);
});
if (route().head === "search") $("gsearch").value = route().arg;
render();
if (!settings.key || location.hash === "#settings") showSettings(true);
if (settings.key) reload();
window.addEventListener("focus", () => { if (!pending && settings.key) reload(); });
setInterval(() => { if (!pending && settings.key && !document.hidden) reload(); }, 120000);
</script>
