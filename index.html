<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyle's To-Do Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a project rail on the left, the working list on the right; stacks to one column on phones. */
:root {
  --bg: #F3F5F7; --panel: #FFFFFF; --ink: #16202A; --muted: #5B6875; --faint: #8A96A2; --line: #DCE2E8; --hover: #EAEEF2;
  --accent: #1F5FBF; --accent-ink: #FFFFFF; --accent-soft: #E3ECF9;
  --late: #C2362B; --late-soft: #FBE7E4; --soon: #A86500; --soon-soft: #FBF0DC; --ok: #2E7D4F;
  --p1: #1F5FBF; --p2: #B5487A; --p3: #2E7D4F; --p4: #A86500; --p5: #6B4FC4; --p6: #2A8A93; --p7: #6B7785;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #11171D; --panel: #18212A; --ink: #E6ECF1; --muted: #A0ADB9; --faint: #74818D; --line: #2A3540; --hover: #212C36;
  --accent: #6FA2F0; --accent-ink: #0B1420; --accent-soft: #1C2D44;
  --late: #F07A6E; --late-soft: #3A1E1C; --soon: #E2A94A; --soon-soft: #352915; --ok: #6CC290;
  --p1: #6FA2F0; --p2: #E383AE; --p3: #6CC290; --p4: #E2A94A; --p5: #A893F0; --p6: #5CC3CB; --p7: #9AA6B2;
  color-scheme: dark;
} }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
header.top h1 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -0.01em; margin: 0; }
.topright { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.date, .sync { font-family: var(--mono); font-size: 12.5px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.sync.busy { color: var(--soon); }
.sync.err { color: var(--late); }
.linkbtn { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13.5px; font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-align: left; display: grid; gap: 2px; }
.stat:hover { border-color: var(--accent); }
.stat .n { font-family: var(--display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stat.late .n { color: var(--late); }
.stat.soon .n { color: var(--soon); }

.add, .settings { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.add .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.add input[type=text] { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.add select, .add input[type=date], .field select, .field input, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--late); }
.btn.danger.armed { background: var(--late); color: var(--panel); border-color: var(--late); }
.hint { font-size: 12.5px; color: var(--faint); }
.hint code { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.settings h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.settings p { margin: 0; color: var(--muted); max-width: 65ch; }
.settings .fields { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.settings .result { font-size: 14px; }
.settings .result.ok { color: var(--ok); }
.settings .result.bad { color: var(--late); }

.main { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; align-items: start; }
aside.rail { display: grid; gap: 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.rail h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 0 0 6px 10px; font-weight: 600; }
.navlist { display: grid; gap: 2px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; text-align: left; }
.nav:hover { background: var(--hover); }
.nav[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .ct { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--p7); }
.newproj { display: flex; gap: 6px; padding: 4px 0 0 4px; }
.newproj input { flex: 1; min-width: 0; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 14px; }

section.list { display: grid; gap: 18px; min-width: 0; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar h2 { font-family: var(--display); font-size: 21px; font-weight: 700; margin: 0; }
.toolbar input { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 10px; width: 220px; max-width: 100%; }
.group { display: grid; gap: 6px; }
.group h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; display: flex; gap: 8px; align-items: center; }
.group h3 .ct { font-family: var(--mono); color: var(--faint); }
.group.late h3 { color: var(--late); }
ul.tasks { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
li.task { border-top: 1px solid var(--line); }
li.task:first-child { border-top: 0; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 12px; }
.trow:hover { background: var(--hover); }
.check { width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--faint); background: transparent; padding: 0; display: grid; place-items: center; }
.check:hover { border-color: var(--ok); }
.task.p-high .check { border-color: var(--late); }
.task.done .check { background: var(--ok); border-color: var(--ok); }
.task.done .check::after { content: ""; width: 5px; height: 9px; border: solid var(--panel); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.tbody { border: 0; background: transparent; padding: 0; text-align: left; min-width: 0; display: grid; gap: 4px; }
.ttitle { font-weight: 500; overflow-wrap: anywhere; }
.task.done .ttitle { text-decoration: line-through; color: var(--faint); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 1px 8px; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
.chip.due { font-family: var(--mono); font-size: 11.5px; }
.chip.due.late { color: var(--late); background: var(--late-soft); border-color: transparent; font-weight: 500; }
.chip.due.soon { color: var(--soon); background: var(--soon-soft); border-color: transparent; }
.chip.wait { color: var(--p5); }
.chip.doing { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.pri { color: var(--late); border-color: transparent; background: var(--late-soft); font-weight: 600; }
.notes-flag { color: var(--faint); }
.star { border: 0; background: transparent; padding: 2px 4px; font-size: 17px; line-height: 1; color: var(--line); }
.star:hover, .star[aria-pressed="true"] { color: var(--soon); }

.edit { padding: 4px 12px 14px 44px; display: grid; gap: 10px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field input, .field select, .field textarea { font-size: 14px; color: var(--ink); width: 100%; }
.field textarea { min-height: 140px; resize: vertical; }
.edit .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.edit .actions .spacer { flex: 1; }
.source a { color: var(--accent); }

.empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 820px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  aside.rail { position: static; }
  .navlist.projects, .navlist.views { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .navlist .nav { width: auto; white-space: nowrap; }
  .navlist.projects .nav { border: 1px solid var(--line); background: var(--panel); }
  .newproj { display: none; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats .stat:nth-child(n+4) { display: none; }
  .fields, .settings .fields { grid-template-columns: minmax(0, 1fr); }
  .edit { padding-left: 12px; }
}
@media (prefers-reduced-motion: no-preference) { .trow, .nav, .stat { transition: background-color .12s, border-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Kyle's To-Do Desk</h1>
    <div class="topright">
      <span class="sync" id="sync"></span>
      <span class="date" id="today"></span>
      <button class="linkbtn" id="openSettings" type="button">Settings</button>
    </div>
  </header>

  <form class="settings" id="settings" hidden autocomplete="off">
    <h2>Connect to your to-do list</h2>
    <p>Paste your GitHub key below. It stays in this browser only. Leave the other boxes as they are.</p>
    <div class="fields">
      <label class="field wide">Key<input type="password" id="sKey" placeholder="github_pat_…"></label>
      <label class="field">Owner<input id="sOwner"></label>
      <label class="field">Repository<input id="sRepo"></label>
      <label class="field">Branch<input id="sBranch"></label>
      <label class="field">File<input id="sPath"></label>
    </div>
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button class="btn" type="button" id="sTest">Test connection</button>
      <button class="btn primary" type="submit">Save</button>
      <button class="btn" type="button" id="sClose">Close</button>
      <span class="result" id="sResult"></span>
    </div>
  </form>

  <div class="stats" id="stats"></div>

  <form class="add" id="addForm" autocomplete="off">
    <div class="row">
      <input type="text" id="addTitle" placeholder="Add a to-do… e.g. Send Leads Team the new script #leads !high @Amy" aria-label="New to-do">
      <select id="addProject" aria-label="Project"></select>
      <input type="date" id="addDue" aria-label="Due date">
      <select id="addPri" aria-label="Priority"><option value="">Normal</option><option value="high">High</option><option value="low">Low</option></select>
      <button class="btn primary" type="submit">Add</button>
    </div>
    <div class="hint">Shortcuts in the text: <code>#project</code> picks a project, <code>!high</code> or <code>!low</code> sets priority, <code>@name</code> marks it as waiting on that person.</div>
  </form>

  <div class="main">
    <aside class="rail">
      <div><h2>Views</h2><div class="navlist views" id="views"></div></div>
      <div>
        <h2>Projects</h2>
        <div class="navlist projects" id="projects"></div>
        <form class="newproj" id="newProj"><input type="text" id="newProjName" placeholder="+ New project" aria-label="New project name"></form>
      </div>
    </aside>
    <section class="list" id="list"></section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- todos.md format ----------
// Each to-do is one Markdown line, with optional Dataview-style fields and indented note lines:
//   - [ ] Title [due:: 2026-10-20] [project:: Leads Team] [priority:: high] [waiting:: Amy] [status:: doing] [star:: yes] [created:: 2026-10-19T14:45:00Z] (from [Source](path), added 2026-10-19)
//       A note line
// Sections are "## Open", "## Administrative" and "## Done". A "Projects: A · B · C" line lists the projects.
const FIELD_ORDER = ["due", "project", "priority", "waiting", "status", "star", "created", "done"];
const ADMIN = "Administrative";

function parseDoc(text) {
  const lines = text.replace(/\r\n/g, "\n").split("\n");
  const entries = [];
  let section = null;
  for (const line of lines) {
    const h = line.match(/^##\s+(.+?)\s*$/);
    if (h) { section = h[1]; entries.push({ type: "heading", text: line, name: section }); continue; }
    const m = line.match(/^- \[( |x|X)\] (.*)$/);
    if (m) { entries.push(parseTask(m[1] !== " ", m[2], section)); continue; }
    const last = entries[entries.length - 1];
    if (last && last.type === "task" && /^(\s{2,}|\t)\S/.test(line)) { last.notes.push(line.replace(/^(\t| {1,4})/, "")); continue; }
    entries.push({ type: "raw", text: line });
  }
  return entries;
}
function parseTask(done, body, section) {
  let tail = "";
  let ti = body.lastIndexOf(" (from ");
  if (ti < 0) ti = body.lastIndexOf(" (added ");
  if (ti >= 0 && body.trimEnd().endsWith(")")) { tail = body.slice(ti + 1).trimEnd(); body = body.slice(0, ti); }
  const fields = {};
  body = body.replace(/\s*\[([A-Za-z_]+):: ([^\]]*)\]/g, (m0, k, v) => { fields[k.toLowerCase()] = v.trim(); return ""; }).trim();
  return { type: "task", done, title: body, fields, tail, notes: [], section };
}
function taskLines(t) {
  let s = `- [${t.done ? "x" : " "}] ${t.title}`;
  const keys = FIELD_ORDER.concat(Object.keys(t.fields).filter((k) => !FIELD_ORDER.includes(k)));
  for (const k of keys) if (t.fields[k]) s += ` [${k}:: ${t.fields[k]}]`;
  if (t.tail) s += " " + t.tail;
  return [s].concat(t.notes.filter((n) => n.trim()).map((n) => "    " + n));
}
function serialize(entries) {
  return entries.flatMap((e) => (e.type === "task" ? taskLines(e) : [e.text])).join("\n");
}
function keyOf(t) { return taskLines(t)[0]; }
function projectsLine(entries) { return entries.find((e) => e.type === "raw" && /^Projects:/.test(e.text)); }
function listedProjects(entries) {
  const l = projectsLine(entries);
  return l ? l.text.replace(/^Projects:\s*/, "").split("·").map((s) => s.trim()).filter(Boolean) : [];
}
function sectionFor(t) { return t.done ? "Done" : (t.fields.project === ADMIN || (!t.fields.project && t.section === ADMIN)) ? ADMIN : "Open"; }
function insertTop(entries, sectionName, t) {
  t.section = sectionName;
  let hi = entries.findIndex((e) => e.type === "heading" && e.name === sectionName);
  if (hi < 0) {
    while (entries.length && entries[entries.length - 1].type === "raw" && !entries[entries.length - 1].text.trim()) entries.pop();
    entries.push({ type: "raw", text: "" }, { type: "heading", text: "## " + sectionName, name: sectionName }, { type: "raw", text: "" });
    hi = entries.length - 2;
  }
  let end = entries.findIndex((e, i) => i > hi && e.type === "heading"); if (end < 0) end = entries.length;
  const first = entries.findIndex((e, i) => i > hi && i < end && e.type === "task");
  if (first >= 0) { entries.splice(first, 0, t); return; }
  let pos = end;
  while (pos - 1 > hi && entries[pos - 1].type === "raw" && !entries[pos - 1].text.trim()) pos--;
  const add = [];
  if (entries[pos - 1].type !== "raw" || entries[pos - 1].text.trim()) add.push({ type: "raw", text: "" });
  add.push(t);
  if (pos === end && end < entries.length) add.push({ type: "raw", text: "" });
  entries.splice(pos, 0, ...add);
}
function moveTask(entries, t) {
  const want = sectionFor(t);
  if (t.section === want) return;
  entries.splice(entries.indexOf(t), 1);
  insertTop(entries, want, t);
}

// ---------- settings and GitHub ----------
const DEFAULTS = { owner: "kylewrites33-cloud", repo: "bpf-data", branch: "main", path: "todos.md" };
function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem("todo-desk-settings") || "{}"); } catch (e) {}
  return Object.assign({}, DEFAULTS, s);
}
let settings = loadSettings();
function apiUrl(s) {
  return `https://api.github.com/repos/${encodeURIComponent(s.owner)}/${encodeURIComponent(s.repo)}/contents/${s.path.split("/").map(encodeURIComponent).join("/")}`;
}
function b64ToText(b64) { const bin = atob(b64.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }
function textToB64(text) { const bytes = new TextEncoder().encode(text); let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(bin); }
async function gh(s, method, body) {
  const url = apiUrl(s) + (method === "GET" ? `?ref=${encodeURIComponent(s.branch)}&t=${Date.now()}` : "");
  const r = await fetch(url, {
    method, cache: "no-store",
    headers: { Authorization: `Bearer ${s.key}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!r.ok) { const e = new Error("GitHub " + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function fetchFile(s = settings) { const j = await gh(s, "GET"); return { text: b64ToText(j.content), sha: j.sha }; }
function explain(e) {
  if (e.status === 401) return "GitHub didn't accept the key. Make a new key and paste it in Settings.";
  if (e.status === 403) return "The key can't change this repository. Make a new key with Contents set to Read and write.";
  if (e.status === 404) return "Couldn't find the file. Check that the key includes the bpf-data repository.";
  if (e.status === 409) return "The list changed somewhere else at the same moment. Try again.";
  if (!e.status) return "Couldn't reach GitHub. Check your connection.";
  return "GitHub returned an error (" + e.status + "). Try again.";
}

// ---------- app state ----------
const VIEWS = [
  { id: "today", label: "Today" }, { id: "upcoming", label: "Upcoming" }, { id: "projects", label: "By project" },
  { id: "waiting", label: "Waiting on others" }, { id: "all", label: "All open" }, { id: "done", label: "Done" },
];
const PRI_RANK = { high: 0, "": 1, low: 2 };
let entries = [], sha = null, loaded = false;
let view = "today", projectFilter = null, q = "", openKey = null, armedDelete = null;
try { const v = localStorage.getItem("todo-desk-view"); if (v && VIEWS.some((x) => x.id === v)) view = v; } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
const todayStr = () => ymd(new Date());
function daysFromToday(s) { return Math.round((parseYmd(s) - parseYmd(todayStr())) / 86400000); }
function fmtDue(s) {
  const n = daysFromToday(s);
  if (n === 0) return "Today"; if (n === 1) return "Tomorrow"; if (n === -1) return "Yesterday";
  const d = parseYmd(s);
  if (n > 1 && n < 7) return d.toLocaleDateString(undefined, { weekday: "short" });
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

// A view model of each to-do, built from the parsed file.
function view_(t) {
  const f = t.fields;
  const due = /^\d{4}-\d{2}-\d{2}$/.test(f.due || "") ? f.due : null;
  const project = f.project || (t.section === ADMIN ? ADMIN : "");
  const status = t.done ? "done" : f.status === "doing" ? "doing" : (f.status === "waiting" || f.waiting) ? "waiting" : "todo";
  const src = t.tail.match(/\[([^\]]+)\]\(([^)\s]+)\)/);
  let source = null;
  if (src) {
    const url = /^https?:/.test(src[2]) ? src[2] : `https://github.com/${settings.owner}/${settings.repo}/blob/${settings.branch}/${src[2]}`;
    source = { label: src[1], url };
  }
  const added = (t.tail.match(/added (\d{4}-\d{2}-\d{2})/) || [])[1] || (f.created || "").slice(0, 10);
  return { t, key: keyOf(t), title: t.title, done: t.done, due, project, status, priority: f.priority === "high" || f.priority === "low" ? f.priority : "",
    waiting: f.waiting || "", star: f.star === "yes", notes: t.notes.join("\n"), source, added, doneOn: f.done || "" };
}
function tasks() { return entries.filter((e) => e.type === "task").map(view_); }
function projects() {
  const names = listedProjects(entries);
  for (const v of tasks()) if (v.project && !names.includes(v.project)) names.push(v.project);
  const list = names.filter((n) => n !== ADMIN).concat([ADMIN]);
  return list.map((name, i) => ({ name, color: name === ADMIN ? "p7" : "p" + ((i % 6) + 1) }));
}
const projColor = (name) => "var(--" + (projects().find((p) => p.name === name)?.color || "p7") + ")";

function sortTasks(list) {
  return list.slice().sort((a, b) => (PRI_RANK[a.priority] - PRI_RANK[b.priority]) || (a.due || "9999").localeCompare(b.due || "9999"));
}
const openTasks = () => tasks().filter((t) => !t.done);
function visible(list) {
  let out = list;
  if (projectFilter) out = out.filter((t) => t.project === projectFilter);
  if (q) { const n = q.toLowerCase(); out = out.filter((t) => [t.title, t.notes, t.waiting, t.project].some((f) => (f || "").toLowerCase().includes(n))); }
  return out;
}

// ---------- rendering ----------
function renderStats() {
  const o = openTasks();
  const c = (f) => o.filter(f).length;
  const overdue = c((t) => t.due && daysFromToday(t.due) < 0), dueToday = c((t) => t.due && daysFromToday(t.due) === 0);
  const cells = [
    { n: overdue, l: "Overdue", cls: overdue ? "late" : "", v: "upcoming" },
    { n: dueToday, l: "Due today", cls: dueToday ? "soon" : "", v: "today" },
    { n: c((t) => t.due && daysFromToday(t.due) >= 0 && daysFromToday(t.due) <= 7), l: "Next 7 days", cls: "", v: "upcoming" },
    { n: c((t) => t.status === "waiting"), l: "Waiting on others", cls: "", v: "waiting" },
    { n: o.length, l: "Open", cls: "", v: "all" },
  ];
  $("stats").innerHTML = cells.map((x) => `<button class="stat ${x.cls}" data-view="${x.v}"><span class="n">${loaded ? x.n : "–"}</span><span class="l">${x.l}</span></button>`).join("");
}
function renderRail() {
  const o = openTasks();
  const counts = { today: o.filter((t) => (t.due && daysFromToday(t.due) <= 0) || t.star).length, upcoming: o.filter((t) => t.due).length,
    projects: o.length, waiting: o.filter((t) => t.status === "waiting").length, all: o.length, done: tasks().length - o.length };
  $("views").innerHTML = VIEWS.map((v) => `<button class="nav" data-view="${v.id}" aria-current="${view === v.id}">${esc(v.label)}<span class="ct">${loaded ? counts[v.id] : ""}</span></button>`).join("");
  const ps = projects();
  $("projects").innerHTML = [`<button class="nav" data-project="" aria-current="${!projectFilter}"><span class="dot" style="background:var(--faint)"></span>All projects</button>`]
    .concat(ps.map((p) => `<button class="nav" data-project="${esc(p.name)}" aria-current="${projectFilter === p.name}"><span class="dot" style="background:var(--${p.color})"></span>${esc(p.name)}<span class="ct">${o.filter((t) => t.project === p.name).length || ""}</span></button>`)).join("");
  const sel = $("addProject"), cur = sel.value;
  sel.innerHTML = `<option value="">No project</option>` + ps.map((p) => `<option>${esc(p.name)}</option>`).join("");
  sel.value = projectFilter || cur || "";
}
function taskHtml(t) {
  const chips = [];
  if (t.priority === "high") chips.push(`<span class="chip pri">High</span>`);
  if (t.due && !t.done) { const n = daysFromToday(t.due); chips.push(`<span class="chip due ${n < 0 ? "late" : n <= 1 ? "soon" : ""}">${n < 0 ? "Overdue · " : ""}${esc(fmtDue(t.due))}</span>`); }
  else if (t.done && t.doneOn) chips.push(`<span class="chip due">Done ${esc(fmtDue(t.doneOn))}</span>`);
  if (t.project && (view !== "projects" || projectFilter)) chips.push(`<span class="chip"><span class="dot" style="background:${projColor(t.project)}"></span>${esc(t.project)}</span>`);
  if (t.status === "doing") chips.push(`<span class="chip doing">In progress</span>`);
  if (t.status === "waiting") chips.push(`<span class="chip wait">Waiting${t.waiting ? " on " + esc(t.waiting) : ""}</span>`);
  if (t.notes) chips.push(`<span class="notes-flag">Notes</span>`);
  const isOpen = openKey === t.key;
  return `<li class="task p-${t.priority || "med"} ${t.done ? "done" : ""}" data-key="${esc(t.key)}">
    <div class="trow">
      <button class="check" data-act="toggle" aria-label="${t.done ? "Mark not done" : "Mark done"}"></button>
      <button class="tbody" data-act="open" aria-expanded="${isOpen}"><span class="ttitle">${esc(t.title)}</span>${chips.length ? `<span class="meta">${chips.join("")}</span>` : ""}</button>
      ${t.done ? "<span></span>" : `<button class="star" data-act="star" aria-pressed="${t.star}" title="${t.star ? "Remove from Today" : "Add to Today"}" aria-label="Star for today">★</button>`}
    </div>
    ${isOpen ? editHtml(t) : ""}
  </li>`;
}
function editHtml(t) {
  const ps = projects();
  const opts = (pairs, cur) => pairs.map(([k, v]) => `<option value="${esc(k)}" ${k === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  return `<form class="edit" data-edit="${esc(t.key)}">
    <div class="fields">
      <label class="field wide">To-do<input name="title" value="${esc(t.title)}"></label>
      <label class="field">Project<select name="project">${opts([["", "No project"]].concat(ps.map((p) => [p.name, p.name])), t.project)}</select></label>
      <label class="field">Status<select name="status">${opts([["todo", "To do"], ["doing", "In progress"], ["waiting", "Waiting"], ["done", "Done"]], t.status)}</select></label>
      <label class="field">Priority<select name="priority">${opts([["high", "High"], ["", "Normal"], ["low", "Low"]], t.priority)}</select></label>
      <label class="field">Due date<input type="date" name="due" value="${esc(t.due || "")}"></label>
      <label class="field">Waiting on<input name="waiting" value="${esc(t.waiting)}" placeholder="Person or team"></label>
      <label class="field wide">Notes<textarea name="notes">${esc(t.notes)}</textarea></label>
    </div>
    <div class="actions">
      <button class="btn primary" type="submit">Save</button>
      <button class="btn" type="button" data-act="close">Cancel</button>
      ${t.source ? `<span class="hint source">From <a href="${esc(t.source.url)}" target="_blank" rel="noopener">${esc(t.source.label)}</a></span>` : ""}
      <span class="spacer"></span>
      <button class="btn danger ${armedDelete === t.key ? "armed" : ""}" type="button" data-act="delete">${armedDelete === t.key ? "Click again to delete" : "Delete"}</button>
    </div>
    ${t.added ? `<div class="hint">Added ${esc(parseYmd(t.added).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }))}</div>` : ""}
  </form>`;
}
function group(title, list, cls = "") {
  if (!list.length) return "";
  return `<div class="group ${cls}"><h3>${esc(title)}<span class="ct">${list.length}</span></h3><ul class="tasks">${list.map(taskHtml).join("")}</ul></div>`;
}
function renderList() {
  const label = VIEWS.find((v) => v.id === view).label;
  let html = `<div class="toolbar"><h2>${esc(label)}${projectFilter ? " · " + esc(projectFilter) : ""}</h2><input type="search" id="search" placeholder="Search to-dos" value="${esc(q)}" aria-label="Search to-dos"></div>`;
  if (!loaded) { $("list").innerHTML = html + `<div class="empty">${settings.key ? "Loading your to-dos…" : "Open Settings and paste your GitHub key to load your to-dos."}</div>`; return; }
  const o = visible(openTasks());
  let body = "";
  const by = (f) => sortTasks(o.filter((t) => t.due && f(daysFromToday(t.due))));
  if (view === "today") {
    body = group("Overdue", by((n) => n < 0), "late") + group("Due today", by((n) => n === 0)) +
      group("Starred for today", sortTasks(o.filter((t) => t.star && !(t.due && daysFromToday(t.due) <= 0))));
    if (!body) body = `<div class="empty">Nothing due today. Star a to-do to pin it here.</div>` + group("Coming up next", o.filter((t) => t.due).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 5));
  } else if (view === "upcoming") {
    body = group("Overdue", by((n) => n < 0), "late") + group("Today", by((n) => n === 0)) + group("Tomorrow", by((n) => n === 1)) +
      group("Next 7 days", by((n) => n > 1 && n <= 7)) + group("Later", by((n) => n > 7)) + group("No due date", sortTasks(o.filter((t) => !t.due)));
  } else if (view === "projects") {
    body = projects().map((p) => group(p.name, sortTasks(o.filter((t) => t.project === p.name)))).join("") + group("No project", sortTasks(o.filter((t) => !t.project)));
  } else if (view === "waiting") {
    const w = o.filter((t) => t.status === "waiting");
    body = [...new Set(w.map((t) => t.waiting || "Someone"))].sort().map((n) => group(n, sortTasks(w.filter((t) => (t.waiting || "Someone") === n)))).join("");
    if (!body) body = `<div class="empty">Nothing is waiting on anyone. Set a to-do's status to Waiting, or add one with <code>@name</code>.</div>`;
  } else if (view === "all") body = group("Open", sortTasks(o));
  else if (view === "done") {
    body = group("Done", visible(tasks().filter((t) => t.done)).slice(0, 150));
    if (!body) body = `<div class="empty">Finished to-dos land here.</div>`;
  }
  if (!body) body = `<div class="empty">${q || projectFilter ? "No to-dos match." : "No open to-dos. Add one above."}</div>`;
  $("list").innerHTML = html + body;
}
function render() {
  $("today").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  renderStats(); renderRail();
  if (!document.activeElement?.closest?.("form[data-edit]")) renderList();
}

// ---------- saving ----------
let toastTimer = null;
function toast(msg) { const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 3600); }
function setSync(text, cls = "") { const el = $("sync"); el.textContent = text; el.className = "sync " + cls; }

// Every change is an operation applied to a fresh copy of todos.md, so edits from the meeting and Slack routines are never overwritten.
let queue = Promise.resolve(), pending = 0;
function mutate(op, message, okMsg) {
  if (!settings.key) { toast("Open Settings and paste your GitHub key first."); return; }
  try { op(entries); } catch (e) {}
  render();
  pending++; setSync("Saving…", "busy");
  queue = queue.then(async () => {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const f = await fetchFile();
        const fresh = parseDoc(f.text);
        if (op(fresh) === false) throw Object.assign(new Error("gone"), { gone: true });
        const out = serialize(fresh);
        const r = await gh(settings, "PUT", { message: "To-Do Desk: " + message, content: textToB64(out), sha: f.sha, branch: settings.branch });
        sha = r.content.sha; entries = fresh;
        if (okMsg) toast(okMsg);
        return;
      } catch (e) {
        if (e.status === 409 && attempt < 2) continue;
        toast(e.gone ? "That to-do was changed somewhere else. Showing the latest list." : explain(e));
        await reload();
        return;
      }
    }
  }).finally(() => { pending--; if (!pending) setSync("Saved"); render(); });
}
async function reload() {
  if (!settings.key) { loaded = false; render(); return; }
  try { const f = await fetchFile(); if (pending) return; entries = parseDoc(f.text); sha = f.sha; loaded = true; setSync("Up to date"); }
  catch (e) { setSync("Not connected", "err"); toast(explain(e)); }
  render();
}
const short = (s) => (s.length > 60 ? s.slice(0, 57) + "…" : s);
function findTask(list, key) { return list.find((e) => e.type === "task" && keyOf(e) === key); }

// ---------- actions ----------
function parseQuick(text) {
  let title = text, project = null, priority = null, waiting = null;
  title = title.replace(/(^|\s)#([\w&-]+)/g, (m, sp, tag) => {
    const k = tag.toLowerCase().replace(/[^a-z0-9]/g, "");
    const hit = projects().find((p) => p.name.toLowerCase().replace(/[^a-z0-9]/g, "").startsWith(k));
    if (hit) { project = hit.name; return sp; } return m;
  });
  title = title.replace(/(^|\s)!(high|h|low|l)\b/gi, (m, sp, p) => { priority = p[0].toLowerCase() === "h" ? "high" : "low"; return sp; });
  title = title.replace(/(^|\s)@([\w.-]+)/g, (m, sp, who) => { waiting = who; return sp; });
  return { title: title.replace(/\s+/g, " ").replace(/[\[\]]/g, "").trim(), project, priority, waiting };
}
$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const p = parseQuick($("addTitle").value);
  if (!p.title) return;
  const now = new Date();
  const fields = { due: $("addDue").value || "", project: p.project || $("addProject").value || "", priority: p.priority || $("addPri").value,
    waiting: p.waiting || "", status: p.waiting ? "waiting" : "", star: view === "today" && !$("addDue").value ? "yes" : "", created: now.toISOString().replace(/\.\d+Z$/, "Z") };
  const make = () => ({ type: "task", done: false, title: p.title, fields: { ...fields }, tail: `(added ${ymd(now)})`, notes: [], section: null });
  mutate((list) => { const t = make(); insertTop(list, sectionFor(t), t); }, "add " + short(p.title), "Added");
  $("addTitle").value = ""; $("addDue").value = ""; $("addPri").value = "";
});
$("newProj").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("newProjName").value.trim().replace(/[·\[\]]/g, "");
  if (!name) return;
  $("newProjName").value = "";
  mutate((list) => {
    const names = listedProjects(list); if (names.includes(name)) return;
    names.push(name);
    const l = projectsLine(list), text = "Projects: " + names.join(" · ");
    if (l) l.text = text;
    else { const i = list.findIndex((x) => x.type === "heading"); list.splice(i < 0 ? list.length : i, 0, { type: "raw", text }, { type: "raw", text: "" }); }
  }, "add project " + name, "Project added");
});
document.addEventListener("click", (e) => {
  const v = e.target.closest("[data-view]");
  if (v) { view = v.dataset.view; openKey = null; try { localStorage.setItem("todo-desk-view", view); } catch (err) {} render(); return; }
  const pj = e.target.closest("[data-project]");
  if (pj) { projectFilter = pj.dataset.project || null; openKey = null; render(); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const key = act.closest("li.task")?.dataset.key, cur = findTask(entries, key);
  if (!cur) return;
  const a = act.dataset.act;
  if (a === "open") { openKey = openKey === key ? null : key; armedDelete = null; renderList(); }
  else if (a === "close") { openKey = null; armedDelete = null; renderList(); }
  else if (a === "toggle") {
    const done = !cur.done;
    mutate((list) => { const t = findTask(list, key); if (!t) return false;
      t.done = done; t.fields.done = done ? todayStr() : ""; if (done) t.fields.star = ""; if (done && t.fields.status) t.fields.status = "";
      moveTask(list, t); }, (done ? "done: " : "reopen: ") + short(cur.title), done ? "Done" : "Reopened");
  } else if (a === "star") {
    mutate((list) => { const t = findTask(list, key); if (!t) return false; t.fields.star = t.fields.star === "yes" ? "" : "yes"; }, "star: " + short(cur.title));
  } else if (a === "delete") {
    if (armedDelete !== key) { armedDelete = key; renderList(); return; }
    armedDelete = null; openKey = null;
    mutate((list) => { const t = findTask(list, key); if (!t) return false; list.splice(list.indexOf(t), 1); }, "delete: " + short(cur.title), "Deleted");
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-edit]");
  if (!f) return;
  e.preventDefault();
  const key = f.dataset.edit, fd = new FormData(f), status = fd.get("status");
  openKey = null;
  mutate((list) => {
    const t = findTask(list, key); if (!t) return false;
    t.title = String(fd.get("title")).replace(/[\[\]]/g, "").trim() || t.title;
    const project = fd.get("project");
    t.fields.project = project === ADMIN && t.section === ADMIN ? "" : project;
    t.fields.priority = fd.get("priority"); t.fields.due = fd.get("due") || "";
    t.fields.waiting = String(fd.get("waiting") || "").replace(/[\[\]]/g, "").trim();
    t.fields.status = status === "doing" || status === "waiting" ? status : "";
    const done = status === "done";
    if (done && !t.done) { t.fields.done = todayStr(); t.fields.star = ""; }
    if (!done) t.fields.done = "";
    t.done = done;
    t.notes = String(fd.get("notes") || "").split("\n").map((s) => s.trimEnd()).filter(Boolean);
    moveTask(list, t);
  }, "edit: " + short(String(fd.get("title"))), "Saved");
});
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  q = e.target.value.trim();
  const pos = e.target.selectionStart; renderList();
  const s = $("search"); s.focus(); try { s.setSelectionRange(pos, pos); } catch (err) {}
});

// ---------- settings panel ----------
function showSettings(show) {
  $("settings").hidden = !show;
  if (show) { $("sKey").value = settings.key || ""; $("sOwner").value = settings.owner; $("sRepo").value = settings.repo; $("sBranch").value = settings.branch; $("sPath").value = settings.path; $("sResult").textContent = ""; }
}
const formSettings = () => ({ key: $("sKey").value.trim(), owner: $("sOwner").value.trim() || DEFAULTS.owner, repo: $("sRepo").value.trim() || DEFAULTS.repo, branch: $("sBranch").value.trim() || DEFAULTS.branch, path: $("sPath").value.trim() || DEFAULTS.path });
$("openSettings").addEventListener("click", () => showSettings($("settings").hidden));
$("sClose").addEventListener("click", () => showSettings(false));
$("sTest").addEventListener("click", async () => {
  const r = $("sResult"); r.className = "result"; r.textContent = "Testing…";
  try { const f = await fetchFile(formSettings()); const n = parseDoc(f.text).filter((x) => x.type === "task").length; r.className = "result ok"; r.textContent = `Connected. Found ${n} to-dos.`; }
  catch (e) { r.className = "result bad"; r.textContent = explain(e); }
});
$("settings").addEventListener("submit", (e) => {
  e.preventDefault();
  settings = formSettings();
  try { localStorage.setItem("todo-desk-settings", JSON.stringify(settings)); } catch (err) { toast("This browser wouldn't save the key. It will work until you close the tab."); }
  showSettings(false); reload();
});

// ---------- start ----------
render();
if (!settings.key || location.hash === "#settings") showSettings(true);
if (settings.key) reload();
window.addEventListener("hashchange", () => { if (location.hash === "#settings") showSettings(true); });
window.addEventListener("focus", () => { if (!pending && settings.key) reload(); });
setInterval(() => { if (!pending && settings.key && !document.hidden && !document.activeElement?.closest?.("form[data-edit]")) reload(); }, 120000);
</script>
</body>
</html>
